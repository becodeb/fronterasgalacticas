server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location ~* \.(css|js|html)$ { add_header Cache-Control "no-cache"; }
  location ~* \.(svg|jpg|jpeg|png|webp|woff2|mp4)$ { expires 1h; add_header Cache-Control "public"; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
